name: etrm-data-360
description: ETRM Data 360 - Energy Trading Risk Management Platform powered by Databricks
command: 
  - "gunicorn"
  - "-k"
  - "uvicorn.workers.UvicornWorker"
  - "--chdir"
  - "backend"
  - "app.main:app"
  - "--bind"
  - "0.0.0.0:8000"
  - "--workers"
  - "1"
  - "--timeout"
  - "240"
  - "--access-logfile"
  - "-"
  - "--error-logfile"
  - "-"

environment:
  PORT: "8000"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "backend"
  FRONTEND_DIST_PATH: "../frontend/dist"
  
  # Configuration Databricks (à configurer lors du déploiement)
  # DATABRICKS_HOST: "https://e2-demo-field-eng.cloud.databricks.com"
  # DATABRICKS_CLIENT_ID: "configure-via-databricks-apps-ui"
  # DATABRICKS_CLIENT_SECRET: "configure-via-databricks-apps-ui"
  
  # AgentBricks Configuration
  AGENTBRICKS_ENDPOINT: "mas-e24eb1c1-endpoint"
  
# Resource configuration for Databricks Apps
resources:
  cpu: "1"
  memory: "2Gi"

# Health check configuration
health_check:
  path: "/health"
  port: 8000
  initial_delay_seconds: 30
  period_seconds: 10
  timeout_seconds: 5
  failure_threshold: 3
