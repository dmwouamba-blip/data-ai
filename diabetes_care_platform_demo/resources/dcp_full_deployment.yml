resources:
  jobs:
    dcp_full_platform_deployment:
      name: ${bundle.target}-DCP-Full-Platform-Deployment

      max_concurrent_runs: 1
      timeout_seconds: 14400

      email_notifications:
        on_failure:
          - d.m.wouamba@gmail.com

      environments:
        - environment_key: serverless_env
          spec:
            client: "1"

      tasks:

        - task_key: archive_cleanup
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../src/setup/00_archive_cleanup.sql

        - task_key: setup_catalog
          depends_on:
            - { task_key: archive_cleanup }
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../src/setup/00_setup.sql

        - task_key: source_catalog
          depends_on:
            - { task_key: setup_catalog }
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../src/setup/01_source_catalog.sql

        - task_key: generate_healthcare
          depends_on:
            - { task_key: source_catalog }
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../src/notebooks/02_generate_healthcare_landing_notebook.py

        - task_key: generate_domain
          depends_on:
            - { task_key: generate_healthcare }
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../src/notebooks/03_generate_domain_landing_notebook.py

        - task_key: generate_dashboard_data
          depends_on:
            - { task_key: generate_domain }
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../src/notebooks/08_generate_complete_dashboard_data_notebook.py

        - task_key: ingest_bronze
          depends_on:
            - { task_key: generate_dashboard_data }
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../src/notebooks/04_ingest_landing_to_bronze_importable_notebook.py

        - task_key: precheck
          depends_on:
            - { task_key: ingest_bronze }
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../src/notebooks/05a_precheck_silver_gold_notebook.py

        - task_key: silver_views
          depends_on:
            - { task_key: precheck }
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../src/sql/05_silver_views.sql

        - task_key: gold_glucose
          depends_on:
            - { task_key: silver_views }
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../src/sql/06_gold_glucose_products.sql

        - task_key: gold_consent
          depends_on:
            - { task_key: silver_views }
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../src/sql/07_gold_consent_products.sql

        - task_key: gold_compliance
          depends_on:
            - { task_key: silver_views }
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../src/sql/08_gold_compliance_products.sql

        - task_key: gold_regulatory
          depends_on:
            - { task_key: silver_views }
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../src/sql/09_gold_regulatory_products.sql

        - task_key: register_dashboard_data
          depends_on:
            - { task_key: gold_glucose }
            - { task_key: gold_consent }
            - { task_key: gold_compliance }
            - { task_key: gold_regulatory }
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../src/sql/dashboard_views/09_register_dashboard_data.sql

        - task_key: validate
          depends_on:
            - { task_key: register_dashboard_data }
          environment_key: serverless_env
          notebook_task:
            notebook_path: ../src/notebooks/10_validate_deployment_notebook.py

      tags:
        project: dcp
        data_class: synthetic
        architecture: medallion
        compute: serverless